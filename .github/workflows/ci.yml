name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Unit and shell tests
        run: npm test
      - name: Block committed signing keys
        run: |
          if git ls-files | grep -Ei '\.(p12|jks|keystore)$'; then
            echo "Signing key files must never be committed"; exit 1
          fi
